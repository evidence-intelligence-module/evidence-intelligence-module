[project]
name = "evidence-intelligence"
version = "0.1.0"
description = "Evidence Generation Pipeline for the Evidence Intelligence Module"
requires-python = ">=3.11"
dependencies = [
    "earthengine-api>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "geoalchemy2>=0.15",
    "shapely>=2.0",
    "pydantic>=2.8",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "reportlab>=4.2",
    "folium>=0.17",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
data = [
    "pandas>=2.2",
]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "ruff>=0.6",
    "black>=24.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evidence_intelligence*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
